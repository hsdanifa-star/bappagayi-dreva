<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Родословные древа Баппагайинского наслега</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#2d5a2c;font-family:Arial;color:white}
        header{text-align:center;padding:50px 20px;background:#1e3a1d}
        h1{font-size:48px}
        .container{max-width:1200px;margin:auto;padding:20px}
        .info{background:white;color:#1e3a1d;padding:25px;border-radius:24px;margin:30px 0;text-align:center}
        .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px;margin:40px 0}
        .card{background:white;border-radius:28px;overflow:hidden;cursor:pointer}
        .card-img{height:400px;display:flex;align-items:center;justify-content:center;background:#f0f0f0}
        .card-img img{max-width:100%;max-height:100%;object-fit:contain}
        .card-content{padding:20px;color:#1e3a1d;text-align:center}
        .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center}
        .modal img{max-width:90%;max-height:90%}
        .close{position:absolute;top:30px;right:40px;font-size:50px;color:white;cursor:pointer}
        footer{text-align:center;padding:30px;background:#1e3a1d}
    </style>
</head>
<body>
<header><h1>🌳  Родословные древа</h1><p>Архив родословных древ</p></header>
<div class="container">
    <div class="info"><strong>Все родословные древа собирали и составляли:</strong><br><br>📜  Кириллин Аркадий Кузьмич<br>📜  Кириллин Валерий Кузьмич</div>
    <div class="gallery" id="gallery"></div>
</div>
<div id="modal" class="modal"><span class="close" onclick="closeModal()">&times;</span><img id="modalImg"></div>
<footer>© 2026 • Родословные древа</footer>

<script>
    // Укажите ваш логин на GitHub
    const owner = 'hsdanifa-star';  // ← ИСПРАВЬТЕ НА СВОЙ ЛОГИН
    const repo = 'bappagayi-dreva';
    const path = 'images';
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    async function loadGallery() {
        try {
            const res = await fetch(apiUrl);
            if (!res.ok) throw new Error('Папка images не найдена');
            const files = await res.json();
            const images = files.filter(f => /\.(jpe?g|png|gif|webp)$/i.test(f.name));
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            images.forEach(file => {
                const imgUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/${path}/${file.name}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img"><img src="${imgUrl}" onclick="openModal('${imgUrl}')" loading="lazy"></div>
                    <div class="card-content">${file.name.replace(/\.jpe?g$/i, '')}</div>
                `;
                gallery.appendChild(card);
            });
            if (images.length === 0) gallery.innerHTML = '<div style="color:white">Нет изображений в папке images</div>';
        } catch(e) {
            document.getElementById('gallery').innerHTML = '<div style="color:white">Ошибка загрузки. Проверьте, что папка images существует и в ней есть файлы.</div>';
        }
    }
    function openModal(src) { document.getElementById('modal').style.display='flex'; document.getElementById('modalImg').src=src; }
    function closeModal() { document.getElementById('modal').style.display='none'; }
    window.onclick = e => { if(e.target===document.getElementById('modal')) closeModal(); };
    loadGallery();
</script>
</body>
</html>
